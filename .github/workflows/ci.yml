name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and runtime dependencies
        run: python -m pip install --no-deps -e .
      - name: Compile Python code
        run: python -m compileall -q src tests scripts
      - name: Unit, security and packaging regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify clean snapshot succeeds
        run: python -m dhcp_scope_sentinel audit examples/baseline.json --policy examples/contracts.json --fail-on high
      - name: Verify unsafe drift fails closed
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'dhcp_scope_sentinel', 'diff',
                                   'examples/baseline.json', 'examples/candidate-risky.json',
                                   '--policy', 'examples/contracts.json', '--fail-on', 'high'], check=False)
          if result.returncode != 2:
              raise SystemExit(f'expected security-gate exit 2, got {result.returncode}')
